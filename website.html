<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KIET College Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f4f4;
            color: #333;
        }

        header {
            background-color: #123c69;
            color: white;
            text-align: center;
            padding: 25px;
        }

        nav {
            background-color: #222;
            text-align: center;
            padding: 12px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
        }

        nav a:hover {
            color: #4da6ff;
        }

        section {
            padding: 30px;
            margin: 20px;
            background-color: white;
            border-radius: 10px;
        }

        h2 {
            color: #123c69;
        }

        .images {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .images img {
            width: 300px;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
        }

        .courses {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .course {
            background-color: #e8f1fa;
            padding: 20px;
            border-radius: 8px;
            width: 200px;
        }

        iframe {
            width: 100%;
            max-width: 700px;
            height: 400px;
            border: none;
            border-radius: 10px;
        }

    

</body>
</html>
