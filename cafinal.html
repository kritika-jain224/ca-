    <!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My AI</title>

  <!-- ================= CSS: how it looks ================= -->
  <style>
    /* Colors are stored in variables so dark mode can swap them easily */
    :root { --bg: white; --side: #f5f5f5; --line: #ddd; --text: #111; }
    body.dark { --bg: #212121; --side: #171717; --line: #444; --text: #eee; }

    * { box-sizing: border-box; margin: 0; font-family: "Segoe UI", sans-serif; }
    body { display: flex; height: 100vh; background: var(--bg); color: var(--text); }
    button { cursor: pointer; font-size: 14px; color: var(--text); }

    /* Left sidebar */
    #sidebar { width: 250px; background: var(--side); padding: 15px; display: flex; flex-direction: column; gap: 6px; }
    #sidebar h2 { margin-bottom: 10px; }
    #newChat { padding: 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; text-align: left; margin-bottom: 10px; }
    .item { padding: 8px 10px; border-radius: 6px; font-size: 14px; cursor: pointer; }
    .item:hover { background: var(--line); }
    .bottom { margin-top: auto; }   /* pushes Settings, Help and profile to the bottom */

    /* Right side (chat area) */
    #main { flex: 1; display: flex; flex-direction: column; align-items: center; }
    #chat { flex: 1; width: 100%; max-width: 700px; overflow-y: auto; padding: 20px; }
    #welcome { text-align: center; margin-top: 15vh; }
    .msg { margin-bottom: 20px; }
    .msg b { display: block; margin-bottom: 4px; }

    /* Message box at the bottom */
    #box { display: flex; width: 90%; max-width: 700px; margin: 10px; padding: 8px; border: 1px solid var(--line); border-radius: 12px; }
    #input { flex: 1; border: none; outline: none; font-size: 16px; background: transparent; color: var(--text); }
    #send { background: var(--text); color: var(--bg); border: none; border-radius: 8px; padding: 8px 14px; }

    /* Popup window for Settings and Help */
        /* Small popup for Settings and Help (sits in the sidebar, chat stays visible) */
    #modal { display: none; position: fixed; left: 15px; bottom: 125px; z-index: 10; }
    #modalBox { background: var(--bg); padding: 15px; border: 1px solid var(--line); border-radius: 12px; width: 220px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 4px 12px rgba(0,0,0,.2); }
    #modalBox button { padding: 8px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; }
  </style>
</head>

<!-- ================= HTML: what is on the page ================= -->
<body>
  <div id="sidebar">
    <h2>✦ My AI</h2>
    <button id="newChat" onclick="location.reload()">+ New Chat</button>
    <div class="item">Explain HTML basics</div>
    <div class="item">CSS project ideas</div>
    <div class="item">JavaScript questions</div>

    <div class="item bottom" onclick="openPanel('Settings')">⚙ Settings</div>
    <div class="item" onclick="openPanel('Help')">? Help</div>
    <div class="item">👤 Student (Free Plan)</div>
  </div>

  <div id="main">
    <div id="chat">
      <div id="welcome">
        <h1>How can I help you?</h1>
        <p>Ask me anything. I can help you learn, write, code and explore ideas.</p>
</body>
</html>
