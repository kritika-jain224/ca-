<!DOCTYPE html>
<!-- tells the browser it is an html document-->
<html lang="en">
    <!-- root tag or parent tag-->
<head>
    <!-- contains info about the webbrowser-->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- tite on the browser-->
</head>
<body>
    <!-- contains all the content of website-->
    <h1> welcome to my website</h1>
    <!-- used to create heading or title-->
    <p> this is my first html webpage.</p>
    <!-- used to write a paragraph-->
    <hr>
    <!-- creates a horizontal ruler o website-->
    <h2> about html</h2>
    <!-- used to create heading but smaller in size then h1 tag-->
    <p> html is used to create webpages.<br>
        <!-- new line tag-->
    html gives structure to a webpage</p>
    <pre>
        name: student
        course: html
        level : beginner
    </pre>
    <!-- keeps the text as formatted in the code-->
</body>
</html>
