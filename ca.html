<body>
    <!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My AI</title>

  <!-- ================= CSS: how it looks ================= -->
  <style>
    * { box-sizing: border-box; margin: 0; font-family: "Segoe UI", sans-serif; }
    body { display: flex; height: 100vh; }

    /* Left sidebar */
    #sidebar { width: 250px; background: #f5f5f5; padding: 15px; display: flex; flex-direction: column; gap: 6px; }
    #sidebar h2 { margin-bottom: 10px; }
    button { cursor: pointer; border: none; font-size: 14px; }
    #newChat { padding: 10px; background: white; border: 1px solid #ddd; border-radius: 8px; text-align: left; margin-bottom: 10px; }
    .item { padding: 8px 10px; border-radius: 6px; font-size: 14px; }
    .item:hover { background: #e3e3e3; }
    .profile { margin-top: auto; }

    /* Right side (chat area) */
    #main { flex: 1; display: flex; flex-direction: column; align-items: center; }
    #chat { flex: 1; width: 100%; max-width: 700px; overflow-y: auto; padding: 20px; }
    #welcome { text-align: center; margin-top: 15vh; }
    .msg { margin-bottom: 20px; }
    .msg b { display: block; margin-bottom: 4px; }

    /* Message box at the bottom */
    #box { display: flex; width: 90%; max-width: 700px; margin: 10px; padding: 8px; border: 1px solid #ddd; border-radius: 12px; }
    #input { flex: 1; border: none; outline: none; font-size: 16px; }
    #send { background: #111; color: white; border-radius: 8px; padding: 8px 14px; }
  </style>
</head>

<!-- ================= HTML: what is on the page ================= -->
<body>
  <div id="sidebar">
    <h2>✦ My AI</h2>
    <button id="newChat" onclick="location.reload()">+ New Chat</button>
    <div class="item">Explain HTML basics</div>
    <div class="item">CSS project ideas</div>
    <div class="item">JavaScript questions</div>
    <div class="item profile">👤 Student (Free Plan)</div>
  </div>

  <div id="main">
    <div id="chat">
      <div id="welcome">
        <h1>How can I help you?</h1>
        <p>Ask me anything. I can help you learn, write, code and explore ideas.</p>
      </div>
    </div>

    <div id="box">
      <input id="input" placeholder="Message My AI..." onkeydown="if (event.key === 'Enter') send()">
      <button id="send" onclick="send()">↑</button>
    </div>
    <p style="font-size:12px; color:gray; margin-bottom:8px;">My AI can make mistakes. Check important information.</p>
  </div>

  <!-- ================= JavaScript: how it works ================= -->
  <script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("input");

    // Show one message on the screen
    function addMessage(who, text) {
      chat.innerHTML += `<div class="msg"><b>${who}</b>${text}</div>`;
      chat.scrollTop = chat.scrollHeight;   // scroll down to newest message
    }

    // Pick a reply based on the words the user typed
    function getReply(text) {
      text = text.toLowerCase();
      if (text.includes("html")) return "HTML stands for HyperText Markup Language. It creates the structure of a web page.";
      if (text.includes("css"))  return "CSS is used to style a web page: colors, fonts and layout.";
      if (text.includes("js") || text.includes("javascript")) return "JavaScript makes a web page interactive.";
      if (text.includes("hello") || text.includes("hi")) return "Hello! How can I help you today?";
      return "Sorry, I am a demo AI. Try asking about HTML, CSS or JavaScript.";
    }

    // Runs when Send is clicked or Enter is pressed
    function send() {
      const text = input.value.trim();
      if (text === "") return;              // do nothing if empty
      document.getElementById("welcome").style.display = "none";
      addMessage("You", text);
      input.value = "";
      setTimeout(() => addMessage("My AI", getReply(text)), 600);  // reply after 0.6 sec
    }
  </script>
</body>
</html>
</body>
</html>
